name: Security

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_ONLY_BINARY: ":all:"

jobs:
  workflow-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python for workflow lint
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' \
            "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" \
            "${archive_path}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/actionlint"
          test -x "${RUNNER_TEMP}/actionlint/actionlint"

      - name: Install pinned pyflakes
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/pyflakes-requirements.txt" <<'EOF'
          pyflakes==3.4.0 \
            --hash=sha256:f742a7dbd0d9cb9ea41e9a24a918996e8170c799fa528688d40dd582c8265f4f
          EOF
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/pyflakes-requirements.txt"

      - name: Run actionlint with shellcheck and pyflakes
        shell: bash
        run: |
          set -euo pipefail
          shellcheck_path="$(command -v shellcheck)"
          pyflakes_path="$(command -v pyflakes)"
          test -n "${shellcheck_path}"
          test -n "${pyflakes_path}"
          "${RUNNER_TEMP}/actionlint/actionlint" \
            -shellcheck="${shellcheck_path}" \
            -pyflakes="${pyflakes_path}" \
            -color

  secret-history-scan:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive_path}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "${archive_path}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/gitleaks"
          test -x "${RUNNER_TEMP}/gitleaks/gitleaks"

      - name: Scan repository and Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks/gitleaks" detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts="--all" \
            --redact \
            --exit-code 1 \
            --no-banner

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install frontend lockfile
        run: npm ci --ignore-scripts

      - name: Audit complete frontend dependency graph
        run: npm audit --audit-level=high

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-locked audit tool
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-security.lock

      - name: Audit all locked Python dependency graphs
        run: |
          python -m pip_audit --requirement requirements-bootstrap.lock --progress-spinner off
          python -m pip_audit --requirement requirements.lock --progress-spinner off
          python -m pip_audit --requirement requirements-live.lock --progress-spinner off
          python -m pip_audit --requirement requirements-test.lock --progress-spinner off
          python -m pip_audit --requirement requirements-build.lock --progress-spinner off
          python -m pip_audit --requirement requirements-security.lock --progress-spinner off

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python,javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
