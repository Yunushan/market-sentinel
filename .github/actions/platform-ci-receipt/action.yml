name: Publish cryptographically attested platform receipt
description: Generate, attest, and upload one exact hosted CI job receipt.

inputs:
  job-key:
    description: Stable workflow job key.
    required: true
  matrix-os:
    description: Matrix operating-system identity when applicable.
    required: false
    default: ""
  matrix-python-version:
    description: Matrix Python identity when applicable.
    required: false
    default: ""
  matrix-name:
    description: Matrix display identity when applicable.
    required: false
    default: ""
  matrix-target:
    description: Matrix mobile target identity when applicable.
    required: false
    default: ""

outputs:
  artifact-name:
    description: Exact run/attempt/job-bound receipt artifact name.
    value: ${{ steps.generate.outputs.artifact-name }}
  identity-sha256:
    description: Canonical source-job identity digest.
    value: ${{ steps.generate.outputs.identity-sha256 }}
  receipt-sha256:
    description: SHA-256 of the exact canonical receipt bytes.
    value: ${{ steps.generate.outputs.receipt-sha256 }}

runs:
  using: composite
  steps:
    - name: Generate canonical hosted-job receipt
      id: generate
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_JOB_KEY: ${{ inputs.job-key }}
        INPUT_MATRIX_OS: ${{ inputs.matrix-os }}
        INPUT_MATRIX_PYTHON_VERSION: ${{ inputs.matrix-python-version }}
        INPUT_MATRIX_NAME: ${{ inputs.matrix-name }}
        INPUT_MATRIX_TARGET: ${{ inputs.matrix-target }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
        git diff --quiet --no-ext-diff "${GITHUB_SHA}" -- \
          .github/actions/platform-ci-receipt/action.yml \
          scripts/platform_ci_receipt.py \
          scripts/trusted_readiness_evidence.py \
          polymarket/funded_policy.py
        receipt_dir="${RUNNER_TEMP}/market-sentinel-platform-receipt"
        mkdir -p "${receipt_dir}"
        python -B -m scripts.platform_ci_receipt generate \
          --repository "${GITHUB_REPOSITORY}" \
          --source-revision "${GITHUB_SHA}" \
          --run-id "${GITHUB_RUN_ID}" \
          --run-attempt "${GITHUB_RUN_ATTEMPT}" \
          --workflow-ref "${GITHUB_WORKFLOW_REF}" \
          --event "${GITHUB_EVENT_NAME}" \
          --job-key "${INPUT_JOB_KEY}" \
          --matrix-os "${INPUT_MATRIX_OS}" \
          --matrix-python-version "${INPUT_MATRIX_PYTHON_VERSION}" \
          --matrix-name "${INPUT_MATRIX_NAME}" \
          --matrix-target "${INPUT_MATRIX_TARGET}" \
          --runner-environment "${RUNNER_ENVIRONMENT}" \
          --runner-os "${RUNNER_OS}" \
          --runner-arch "${RUNNER_ARCH}" \
          --output "${receipt_dir}/platform-ci-receipt.json" \
          --github-output "${GITHUB_OUTPUT}"

    # The transparency log can fail transiently after a successful workload.
    # Individual failures allow bounded retries; the required gate below checks
    # the real outcomes before any receipt can be reverified or uploaded.
    - name: Attest canonical hosted-job receipt (attempt 1)
      id: attest_1
      continue-on-error: true
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.generate.outputs.receipt-path }}

    - name: Wait before receipt attestation retry 2
      id: retry_delay_1
      if: ${{ !cancelled() && steps.attest_1.outcome == 'failure' }}
      shell: bash
      run: sleep 15

    - name: Attest canonical hosted-job receipt (attempt 2)
      id: attest_2
      if: ${{ !cancelled() && steps.attest_1.outcome == 'failure' && steps.retry_delay_1.outcome == 'success' }}
      continue-on-error: true
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.generate.outputs.receipt-path }}

    - name: Wait before receipt attestation retry 3
      id: retry_delay_2
      if: ${{ !cancelled() && steps.attest_2.outcome == 'failure' }}
      shell: bash
      run: sleep 30

    - name: Attest canonical hosted-job receipt (attempt 3)
      id: attest_3
      if: ${{ !cancelled() && steps.attest_1.outcome == 'failure' && steps.attest_2.outcome == 'failure' && steps.retry_delay_2.outcome == 'success' }}
      continue-on-error: true
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.generate.outputs.receipt-path }}

    - name: Require successful receipt attestation
      id: require_attestation
      if: ${{ !cancelled() }}
      shell: bash
      env:
        ATTESTATION_OUTCOME_1: ${{ steps.attest_1.outcome }}
        ATTESTATION_OUTCOME_2: ${{ steps.attest_2.outcome }}
        ATTESTATION_OUTCOME_3: ${{ steps.attest_3.outcome }}
      run: |
        python - <<'PY'
        import os

        outcomes = tuple(os.environ.get(f"ATTESTATION_OUTCOME_{attempt}", "") for attempt in range(1, 4))
        accepted = {
            ("success", "skipped", "skipped"),
            ("failure", "success", "skipped"),
            ("failure", "failure", "success"),
        }
        if outcomes not in accepted:
            raise SystemExit(f"Receipt attestation did not succeed: {outcomes!r}")
        PY

    - name: Reverify canonical hosted-job receipt
      id: reverify
      if: ${{ success() && steps.require_attestation.outcome == 'success' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        EXPECTED_IDENTITY: ${{ steps.generate.outputs.identity-sha256 }}
        EXPECTED_RECEIPT_SHA256: ${{ steps.generate.outputs.receipt-sha256 }}
        RECEIPT_PATH: ${{ steps.generate.outputs.receipt-path }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
        git diff --quiet --no-ext-diff "${GITHUB_SHA}" -- \
          .github/actions/platform-ci-receipt/action.yml \
          scripts/platform_ci_receipt.py \
          scripts/trusted_readiness_evidence.py \
          polymarket/funded_policy.py
        python -B -m scripts.platform_ci_receipt identity \
          --input "${RECEIPT_PATH}" \
          --expected-identity "${EXPECTED_IDENTITY}" \
          --expected-sha256 "${EXPECTED_RECEIPT_SHA256}"

    - name: Upload canonical hosted-job receipt
      if: ${{ success() && steps.require_attestation.outcome == 'success' && steps.reverify.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ steps.generate.outputs.artifact-name }}
        path: ${{ steps.generate.outputs.receipt-path }}
        if-no-files-found: error
        retention-days: 7
