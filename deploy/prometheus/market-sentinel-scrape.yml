# Merge these two top-level mappings into the host's main prometheus.yml.
# This is a reviewed fragment, not a scrape_config_files include document.
scrape_configs:
  - job_name: market-sentinel
    scheme: http
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    honor_labels: false
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/market-sentinel-observability-token
    static_configs:
      - targets:
          - 127.0.0.1:8765
        labels:
          service: market-sentinel

rule_files:
  - /etc/prometheus/rules/market-sentinel-alerts.yml
